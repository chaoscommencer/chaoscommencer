<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <defs>
    <linearGradient id="ms-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="60%"  stop-color="#130c26"/>
      <stop offset="100%" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="ms-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ms-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="60%"  stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="ms-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes ms-border-pulse {
        0%, 100% { opacity: 0.50; }
        50%      { opacity: 1.00; }
      }
      @keyframes ms-twinkle-a {
        0%, 100% { opacity: 0.90; }
        35%      { opacity: 0.20; }
        70%      { opacity: 0.75; }
      }
      @keyframes ms-twinkle-b {
        0%, 100% { opacity: 0.65; }
        25%      { opacity: 0.95; }
        60%      { opacity: 0.10; }
      }
      @keyframes ms-twinkle-c {
        0%, 100% { opacity: 0.80; }
        15%      { opacity: 0.10; }
        55%      { opacity: 0.95; }
      }
      .ms-star-a      { animation: ms-twinkle-a 3.2s ease-in-out infinite; }
      .ms-star-b      { animation: ms-twinkle-b 2.8s ease-in-out infinite; }
      .ms-star-c      { animation: ms-twinkle-c 4.0s ease-in-out infinite; }
      .ms-border-glow { animation: ms-border-pulse 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="495" height="195" rx="14" ry="14" fill="url(#ms-bg)"/>
  <!-- Stars -->
  <circle cx="42"  cy="12"  r="0.8" fill="#c4b5fd" class="ms-star-a" style="animation-delay:0.0s"/>
  <circle cx="138" cy="18"  r="0.7" fill="#93c5fd" class="ms-star-b" style="animation-delay:1.4s"/>
  <circle cx="268" cy="10"  r="1.0" fill="#818cf8" class="ms-star-c" style="animation-delay:2.7s"/>
  <circle cx="382" cy="16"  r="0.9" fill="#c4b5fd" class="ms-star-a" style="animation-delay:0.5s"/>
  <circle cx="462" cy="10"  r="0.7" fill="#93c5fd" class="ms-star-b" style="animation-delay:1.9s"/>
  <circle cx="36"  cy="180" r="0.8" fill="#93c5fd" class="ms-star-b" style="animation-delay:1.0s"/>
  <circle cx="198" cy="185" r="0.7" fill="#818cf8" class="ms-star-c" style="animation-delay:2.2s"/>
  <circle cx="422" cy="182" r="0.9" fill="#c4b5fd" class="ms-star-a" style="animation-delay:0.3s"/>
  <circle cx="478" cy="178" r="0.6" fill="#93c5fd" class="ms-star-b" style="animation-delay:1.7s"/>
  <circle cx="488" cy="60"  r="0.7" fill="#818cf8" class="ms-star-c" style="animation-delay:0.8s"/>
  <circle cx="490" cy="130" r="0.8" fill="#c4b5fd" class="ms-star-a" style="animation-delay:2.4s"/>
  <circle cx="7"   cy="88"  r="0.7" fill="#93c5fd" class="ms-star-b" style="animation-delay:1.1s"/>
  <circle cx="7"   cy="152" r="0.6" fill="#818cf8" class="ms-star-c" style="animation-delay:0.6s"/>
  <!-- Pulsing outer border -->
  <rect x="1.5" y="1.5" width="492" height="192" rx="14" ry="14"
        fill="none" stroke="url(#ms-border)" stroke-width="1.5"
        class="ms-border-glow" filter="url(#ms-glow)"/>
  <rect x="1.5" y="1.5" width="492" height="192" rx="14" ry="14"
        fill="none" stroke="url(#ms-border)" stroke-width="0.5" opacity="0.7"/>
  <!-- Title -->
  <text x="20" y="34"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="15" font-weight="700"
        fill="url(#ms-title)" filter="url(#ms-glow)">GitHub Stats</text>
  <line x1="123" y1="44" x2="371" y2="44"
        stroke="url(#ms-border)" stroke-width="1" opacity="0.40"/>
  <!-- Placeholder -->
  <text x="247" y="120" fill="#94a3b8" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="12" text-anchor="middle">Updating stats…</text>
  <text x="247" y="145" fill="#64748b" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="10" text-anchor="middle">This card is generated by a GitHub Actions workflow — no third-party services involved.</text>
</svg>
