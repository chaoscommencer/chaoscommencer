<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1e0a3c"/>
      <stop offset="35%"  stop-color="#2d1b69"/>
      <stop offset="65%"  stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .tag {
        font: 400 italic 17px Georgia, 'Times New Roman', serif;
        fill: #94a3b8;
      }
      #p1 {
        animation: cycle1 18s ease-in-out infinite;
      }
      #p2 {
        opacity: 0;
        animation: cycle2 18s ease-in-out infinite;
      }
      #p3 {
        opacity: 0;
        animation: cycle3 18s ease-in-out infinite;
      }
      @keyframes cycle1 {
         0%  { opacity: 1 }
        18%  { opacity: 1 }
        26%  { opacity: 0 }
        92%  { opacity: 0 }
        100% { opacity: 1 }
      }
      @keyframes cycle2 {
         0%  { opacity: 0 }
        26%  { opacity: 0 }
        34%  { opacity: 1 }
        51%  { opacity: 1 }
        59%  { opacity: 0 }
        100% { opacity: 0 }
      }
      @keyframes cycle3 {
         0%  { opacity: 0 }
        59%  { opacity: 0 }
        67%  { opacity: 1 }
        84%  { opacity: 1 }
        92%  { opacity: 0 }
        100% { opacity: 0 }
      }
      @keyframes twinkle-a {
        0%, 100% { opacity: 0.85; }
        25%      { opacity: 0.25; }
        50%      { opacity: 0.80; }
        75%      { opacity: 0.10; }
      }
      @keyframes twinkle-b {
        0%, 100% { opacity: 0.70; }
        35%      { opacity: 0.10; }
        65%      { opacity: 0.90; }
      }
      @keyframes twinkle-c {
        0%, 100% { opacity: 0.80; }
        20%      { opacity: 0.95; }
        50%      { opacity: 0.15; }
        80%      { opacity: 0.60; }
      }
      .s1  { animation: twinkle-a 3.2s ease-in-out infinite 0.0s; }
      .s2  { animation: twinkle-b 2.7s ease-in-out infinite 0.8s; }
      .s3  { animation: twinkle-c 4.1s ease-in-out infinite 1.5s; }
      .s4  { animation: twinkle-a 2.3s ease-in-out infinite 2.2s; }
      .s5  { animation: twinkle-b 3.7s ease-in-out infinite 0.5s; }
      .s6  { animation: twinkle-c 2.9s ease-in-out infinite 1.1s; }
      .s7  { animation: twinkle-a 3.5s ease-in-out infinite 2.8s; }
      .s8  { animation: twinkle-b 2.1s ease-in-out infinite 0.3s; }
      .s9  { animation: twinkle-c 4.3s ease-in-out infinite 1.9s; }
      .s10 { animation: twinkle-a 3.0s ease-in-out infinite 2.5s; }
      .s11 { animation: twinkle-b 2.6s ease-in-out infinite 0.7s; }
    </style>
  </defs>
  <!-- wave-divider background -->
  <rect width="1200" height="80" fill="url(#wg)"/>
  <!-- decorative stars (twinkling) -->
  <circle cx="60"   cy="20" r="1.2" fill="#c4b5fd" class="s1"/>
  <circle cx="130"  cy="45" r="0.8" fill="#93c5fd" class="s2"/>
  <circle cx="250"  cy="15" r="1.5" fill="#c4b5fd" class="s3"/>
  <circle cx="390"  cy="55" r="0.9" fill="#818cf8" class="s4"/>
  <circle cx="500"  cy="25" r="1.2" fill="#93c5fd" class="s5"/>
  <circle cx="640"  cy="10" r="1.0" fill="#c4b5fd" class="s6"/>
  <circle cx="720"  cy="60" r="1.4" fill="#818cf8" class="s7"/>
  <circle cx="850"  cy="35" r="0.8" fill="#93c5fd" class="s8"/>
  <circle cx="960"  cy="18" r="1.3" fill="#c4b5fd" class="s9"/>
  <circle cx="1050" cy="50" r="1.0" fill="#818cf8" class="s10"/>
  <circle cx="1140" cy="28" r="1.2" fill="#93c5fd" class="s11"/>
  <!-- glowing accent line -->
  <path d="M0 75 Q300 45 600 65 Q900 85 1200 55" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#glow)"/>
  <!-- bottom wave -->
  <path d="M0 55 Q200 35 400 50 Q600 65 800 48 Q1000 32 1200 50 L1200 80 L0 80 Z" fill="#0d1117" opacity="0.85"/>
  <!-- typing tagline — centered over the colored gradient area (above the dark bottom wave) -->
  <g transform="translate(200,0)">
    <text id="p1" x="400" y="25" text-anchor="middle" class="tag">"Architect, engineer, mathematician, artist — Renaissance man"</text>
    <text id="p2" x="400" y="25" text-anchor="middle" class="tag">"Building elegant systems from the ground up"</text>
    <text id="p3" x="400" y="25" text-anchor="middle" class="tag">"Turning complexity into clarity, one commit at a time"</text>
  </g>
</svg>
