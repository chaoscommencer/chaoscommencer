  <circle cx="487" cy="68" r="0.7" fill="#818cf8" class="tl-star-c" style="animation-delay:0.8s"/>
  <circle cx="489" cy="140" r="0.8" fill="#c4b5fd" class="tl-star-a" style="animation-delay:2.4s"/>
