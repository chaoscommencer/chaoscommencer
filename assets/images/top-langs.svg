<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <defs>
    <!-- Tile neon glow filters -->
    <filter id="lang-glow-outer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14.0"/>
    </filter>
    <filter id="lang-glow-inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0"/>
    </filter>
    <!-- Card-level deep-space gradients and glow filter -->
    <linearGradient id="tl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="60%"  stop-color="#130c26"/>
      <stop offset="100%" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="tl-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tl-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="60%"  stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="tl-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes tl-border-pulse {
        0%, 100% { opacity: 0.50; }
        50%      { opacity: 1.00; }
      }
      @keyframes tl-twinkle-a {
        0%, 100% { opacity: 0.90; }
        35%      { opacity: 0.20; }
        70%      { opacity: 0.75; }
      }
      @keyframes tl-twinkle-b {
        0%, 100% { opacity: 0.65; }
        25%      { opacity: 0.95; }
        60%      { opacity: 0.10; }
      }
      @keyframes tl-twinkle-c {
        0%, 100% { opacity: 0.80; }
        15%      { opacity: 0.10; }
        55%      { opacity: 0.95; }
      }
      .tl-star-a      { animation: tl-twinkle-a 3.2s ease-in-out infinite; }
      .tl-star-b      { animation: tl-twinkle-b 2.8s ease-in-out infinite; }
      .tl-star-c      { animation: tl-twinkle-c 4.0s ease-in-out infinite; }
      .tl-border-glow { animation: tl-border-pulse 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="495" height="195" rx="14" ry="14" fill="url(#tl-bg)"/>
  <!-- Stars -->
