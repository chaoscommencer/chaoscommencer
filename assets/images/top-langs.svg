  <circle cx="142" cy="18" r="0.7" fill="#93c5fd" class="tl-star-b" style="animation-delay:1.4s"/>
  <circle cx="270" cy="10" r="1.0" fill="#818cf8" class="tl-star-c" style="animation-delay:2.7s"/>
