<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 830 48" width="830" height="48">
  <defs>
    <linearGradient id="lcb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#130c26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="lcb-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="lcb-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes lcb-border-pulse {
        0%, 100% { opacity: 0.50; }
        50%      { opacity: 1.00; }
      }
      .lcb-border-glow { animation: lcb-border-pulse 3.2s ease-in-out infinite; }
      @keyframes lcb-ping {
        0%   { r: 8; opacity: 0.65; }
        100% { r: 18; opacity: 0; }
      }
      .lcb-ping { animation: lcb-ping 2.2s ease-out infinite; }
    </style>
  </defs>
  <!-- Full-width background (symmetric vertical gradient for seamless stacking) -->
  <rect width="830" height="48" fill="url(#lcb-bg)"/>
  <!-- Side gutter borders — layered glow for seamless stacking -->
  <path d="M1.5,0 V48 M828.5,0 V48" fill="none" stroke="url(#lcb-border)" stroke-width="7" stroke-opacity="0.08" class="lcb-border-glow"/>
  <path d="M1.5,0 V48 M828.5,0 V48" fill="none" stroke="url(#lcb-border)" stroke-width="4" stroke-opacity="0.15"/>
  <path d="M1.5,0 V48 M828.5,0 V48" fill="none" stroke="url(#lcb-border)" stroke-width="1.5" stroke-opacity="0.55" class="lcb-border-glow"/>
  <path d="M1.5,0 V48 M828.5,0 V48" fill="none" stroke="url(#lcb-border)" stroke-width="0.5" stroke-opacity="0.7"/>
  <!-- Inner sub-card (clickable area) -->
  <rect x="16" y="4" width="798" height="40"
        rx="8" fill="#0b0f1a"
        stroke="#7c3aed" stroke-width="0.5" stroke-opacity="0.35"/>
  <!-- Ping ring around icon -->
  <circle cx="42" cy="24" r="8"
          fill="none" stroke="#7c3aed" stroke-width="0.8"
          class="lcb-ping"/>
  <!-- Icon backing disc -->
  <circle cx="42" cy="24" r="11"
          fill="#0b0f1a" opacity="0.95"/>
  <!-- Icon (24×24 path scaled to ~16px) -->
  <g transform="translate(34,16) scale(0.667)"
     filter="url(#lcb-glow)">
    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#c4b5fd"/>
  </g>
  <!-- Label -->
  <text x="66" y="20" dominant-baseline="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="13.5" font-weight="600"
        fill="#e2e8f0">GitHub</text>
  <!-- URL hint -->
  <text x="66" y="36" dominant-baseline="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="10" fill="#64748b">github.com/chaoscommencer</text>
  <!-- Arrow hint -->
  <text x="810" y="24" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="10" fill="#7c3aed" opacity="0.55">↗</text>
</svg>
