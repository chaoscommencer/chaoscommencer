<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 830 48" width="830" height="48"
     overflow="visible">
  <defs>
    <linearGradient id="rae-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#130c26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rae-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="rae-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes rae-border-pulse {
        0%, 100% { opacity: 0.50; }
        50%      { opacity: 1.00; }
      }
      .rae-border-glow { animation: rae-border-pulse 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Full-width background (symmetric vertical gradient for seamless stacking) -->
  <rect width="830" height="48" fill="url(#rae-bg)"/>
  <!-- Side gutter borders — extend 4px beyond viewBox top/bottom for seamless stacking -->
  <path d="M1.5,-4 V52 M828.5,-4 V52"
        fill="none" stroke="url(#rae-border)" stroke-width="1.5"
        class="rae-border-glow" filter="url(#rae-glow)"/>
  <path d="M1.5,-4 V52 M828.5,-4 V52"
        fill="none" stroke="url(#rae-border)" stroke-width="0.5" opacity="0.7"/>
  <!-- Inner sub-card (the clickable region) -->
  <rect x="16" y="4" width="798" height="40"
        rx="8" fill="#0b0f1a"
        stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.35"/>
  <!-- Neon accent bar inside sub-card -->
  <rect x="20" y="8" width="3" height="32"
        rx="1.5" fill="#22c55e" opacity="0.85" filter="url(#rae-glow)"/>
  <!-- Emoji -->
  <text x="34" y="24" dominant-baseline="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="15">✅</text>
  <!-- Event text -->
  <text x="56" y="24" dominant-baseline="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="12.5" fill="#e2e8f0">Closed issue #129 in `chaoscommencer/chaoscommencer` — PRs Bug</text>
  <!-- Arrow hint -->
  <text x="810" y="24" dominant-baseline="middle" text-anchor="middle"
        font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="10" fill="#22c55e" opacity="0.55">↗</text>
</svg>
