                          keyTimes="0.0000; 0.0312; 0.0625; 0.0938; 0.1250; 0.1562; 0.1875; 0.2188; 0.2500; 0.2812; 0.3125; 0.3438; 0.3750; 0.4062; 0.4375; 0.4688; 0.5000; 0.5312; 0.5625; 0.5938; 0.6250; 0.6562; 0.6875; 0.7188; 0.7500; 0.7812; 0.8125; 0.8438; 0.8750; 0.9062; 0.9375; 0.9688; 1.0000"
                          calcMode="linear"
                          dur="12.0s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale"
                            values="0.900; 0.883; 0.834; 0.761; 0.675; 0.589; 0.516; 0.467; 0.450; 0.467; 0.516; 0.589; 0.675; 0.761; 0.834; 0.883; 0.900; 0.883; 0.834; 0.761; 0.675; 0.589; 0.516; 0.467; 0.450; 0.467; 0.516; 0.589; 0.675; 0.761; 0.834; 0.883; 0.900"
                            keyTimes="0.0000; 0.0312; 0.0625; 0.0938; 0.1250; 0.1562; 0.1875; 0.2188; 0.2500; 0.2812; 0.3125; 0.3438; 0.3750; 0.4062; 0.4375; 0.4688; 0.5000; 0.5312; 0.5625; 0.5938; 0.6250; 0.6562; 0.6875; 0.7188; 0.7500; 0.7812; 0.8125; 0.8438; 0.8750; 0.9062; 0.9375; 0.9688; 1.0000"
                            calcMode="linear"
                            dur="12.0s" repeatCount="indefinite"/>
          <polyline points="-54,0 -28,0 -3,11 31,0" stroke="url(#cur-handle-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <polyline points="-52,-2 -28,-2 -3,9 30,-2" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.50"/>
          <polyline points="-51,-1.5 -30,-1.5" stroke="#2a1206" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.70"/>
          <polyline points="-27,1.5 -4,12" stroke="#2a1206" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.75"/>
