      <text x="44" y="131"
            font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="11.5"
            fill="#94a3b8">architecture · systems design · tooling</text>
    </g>
    <!-- Item 2 (R) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
