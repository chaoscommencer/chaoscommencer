<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 184" width="830" height="184">
  <defs>
    <linearGradient id="cur-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="60%"  stop-color="#130c26"/>
      <stop offset="100%" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="cur-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cur-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="60%"  stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="cur-tl" gradientUnits="userSpaceOnUse"
                    x1="0" y1="62" x2="0" y2="178">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cur-fade" gradientUnits="userSpaceOnUse"
                    x1="0" y1="62" x2="0" y2="178">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="22%"  stop-color="white" stop-opacity="1"/>
      <stop offset="78%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="cur-stage-mask">
      <rect x="0" y="62" width="830" height="116"
            fill="url(#cur-fade)"/>
    </mask>
    <clipPath id="cur-stage-clip">
      <rect x="0" y="62" width="830" height="116"/>
    </clipPath>
    <clipPath id="cur-card-clip">
      <rect x="0" y="0" width="830" height="184"
            rx="14" ry="14"/>
    </clipPath>
    <!-- Handle gradient: pale-weathered tip → honey-amber → dark charcoal kink → russet ferrule -->
    <linearGradient id="cur-handle-grad" gradientUnits="userSpaceOnUse"
                    x1="-54" y1="0" x2="31" y2="0">
      <stop offset="0%"   stop-color="#907055"/>
      <stop offset="25%"  stop-color="#c67c1c"/>
      <stop offset="55%"  stop-color="#4e2508"/>
      <stop offset="80%"  stop-color="#7c3f14"/>
      <stop offset="100%" stop-color="#a07034"/>
    </linearGradient>
    <filter id="cur-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes cur-border-pulse {
        0%, 100% { opacity: 0.50; }
        50%      { opacity: 1.00; }
      }
      @keyframes cur-twinkle-a {
        0%, 100% { opacity: 0.90; }
        35%      { opacity: 0.20; }
        70%      { opacity: 0.75; }
      }
      @keyframes cur-twinkle-b {
        0%, 100% { opacity: 0.65; }
        25%      { opacity: 0.95; }
        60%      { opacity: 0.10; }
      }
      @keyframes cur-twinkle-c {
        0%, 100% { opacity: 0.80; }
        15%      { opacity: 0.10; }
        55%      { opacity: 0.95; }
      }
      .cur-star-a { animation: cur-twinkle-a 3.2s ease-in-out infinite; }
      .cur-star-b { animation: cur-twinkle-b 2.8s ease-in-out infinite; }
      .cur-star-c { animation: cur-twinkle-c 4.0s ease-in-out infinite; }
      .cur-border-glow { animation: cur-border-pulse 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="830" height="184" rx="14" ry="14"
        fill="url(#cur-bg)"/>
  <!-- Stars -->
  <circle cx="50" cy="20" r="1.0" fill="#c4b5fd" class="cur-star-a" style="animation-delay:0.0s"/>
  <circle cx="150" cy="35" r="0.8" fill="#93c5fd" class="cur-star-b" style="animation-delay:1.2s"/>
  <circle cx="280" cy="18" r="1.2" fill="#818cf8" class="cur-star-c" style="animation-delay:2.5s"/>
  <circle cx="100" cy="55" r="0.9" fill="#c4b5fd" class="cur-star-a" style="animation-delay:0.7s"/>
  <circle cx="350" cy="40" r="0.7" fill="#93c5fd" class="cur-star-b" style="animation-delay:1.8s"/>
  <circle cx="600" cy="22" r="1.1" fill="#818cf8" class="cur-star-c" style="animation-delay:0.4s"/>
  <circle cx="700" cy="42" r="0.9" fill="#c4b5fd" class="cur-star-a" style="animation-delay:2.1s"/>
  <circle cx="780" cy="18" r="1.3" fill="#93c5fd" class="cur-star-b" style="animation-delay:0.9s"/>
  <circle cx="820" cy="50" r="0.8" fill="#818cf8" class="cur-star-c" style="animation-delay:1.5s"/>
  <circle cx="28" cy="130" r="0.7" fill="#c4b5fd" class="cur-star-a" style="animation-delay:1.1s"/>
  <circle cx="200" cy="108" r="0.8" fill="#93c5fd" class="cur-star-b" style="animation-delay:2.3s"/>
  <circle cx="760" cy="120" r="0.6" fill="#818cf8" class="cur-star-c" style="animation-delay:0.6s"/>
  <circle cx="490" cy="158" r="0.7" fill="#c4b5fd" class="cur-star-a" style="animation-delay:1.7s"/>
  <circle cx="645" cy="98" r="0.9" fill="#93c5fd" class="cur-star-b" style="animation-delay:0.3s"/>
