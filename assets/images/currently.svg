          <polyline points="-26,3 -4,13.5" stroke="#706050" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.65"/>
          <rect x="28" y="-8" width="14" height="18" rx="2" ry="2" fill="#f59e0b"/>
          <line x1="40" y1="-3.0" x2="72" y2="-27.0" stroke="#9a7a45" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="40" y1="-2.5" x2="72" y2="-20.0" stroke="#b89060" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="40" y1="-1.5" x2="72" y2="-12.0" stroke="#d4a870" stroke-width="2.0" stroke-linecap="round"/>
          <line x1="40" y1="-0.5" x2="72" y2="-5.0" stroke="#ecc870" stroke-width="2.2" stroke-linecap="round"/>
