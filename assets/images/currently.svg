               dur="3.5s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity"
               values="0;0.55;0.55;0" keyTimes="0;0.1;0.9;1"
               dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
