          <line x1="40" y1="0.5" x2="72" y2="5.0" stroke="#ecc870" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="40" y1="1.5" x2="72" y2="12.0" stroke="#c8a060" stroke-width="2.0" stroke-linecap="round"/>
          <line x1="40" y1="2.5" x2="72" y2="20.0" stroke="#a87840" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="40" y1="3.0" x2="72" y2="27.0" stroke="#8a6030" stroke-width="1.4" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
  <!-- Stage ambient track (clip + mask keep it within the stage window) -->
